<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TournamentCam · Main app access</title><style>body{background:#112e27;color:#eef5e8;font:16px system-ui;display:grid;min-height:95vh;place-items:center}main{max-width:400px;padding:32px}h1{font-size:36px}p{line-height:1.7}input,button{box-sizing:border-box;width:100%;padding:14px;margin:12px 0;border-radius:6px;border:0;font:inherit}button{background:#d3f783;cursor:pointer}a{color:#d3f783}#error{color:#ffb9ae}</style><main><h1>Your full courtside app.</h1><p>The complete application is reserved for authorized access. Camera testing is available separately without an application password.</p><form id="form"><label>App password<input id="password" type="password" required autocomplete="current-password"></label><button>Open main application</button></form><p id="error" role="status"></p><a href="/nvr-test">Open Dahua camera testing →</a></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(!r.ok)throw Error((await r.json()).error);location.href='/app';}catch(e){document.getElementById('error').textContent=e.message;}finally{button.disabled=false;}};if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister())));</script></html>
